<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADEL BRAND</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, sans-serif;
        }
        body {
            background-color: #f4f6f8;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        header {
            text-align: center;
            margin: 20px 0 30px;
        }
        header h1 {
            font-size: 2.2rem;
            color: #111;
            letter-spacing: 1px;
        }
        header p {
            color: #666;
            margin-top: 5px;
        }
        .container {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .card {
            background-color: #1e1e24;
            color: #ffffff;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
        }
        .card h2 {
            font-size: 1.4rem;
            margin-bottom: 10px;
            color: #ffffff;
        }
        .card p {
            color: #b3b3b3;
            line-height: 1.6;
            font-size: 0.95rem;
            margin-bottom: 15px;
        }
        .price {
            font-size: 1.2rem;
            font-weight: bold;
            color: #4da6ff;
            margin-bottom: 15px;
        }
        .btn {
            display: inline-block;
            width: 100%;
            padding: 12px;
            background-color: #ffffff;
            color: #1e1e24;
            text-align: center;
            text-decoration: none;
            font-weight: bold;
            border-radius: 8px;
        }
        footer {
            margin-top: auto;
            padding: 20px 0;
            color: #888;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>
    <header>
        <h1>ADEL BRAND</h1>
        <p>فرۆشگای فەرمی بەرهەمەکان</p>
    </header>

    <div class="container">
        <div class="card">
            <h2>بەرهەمی یەکەم</h2>
            <p>وەسفی بەرهەمەکە لێرە بنووسە. دیزاینی تاریک لەسەر باگراوندی ڕۆشن.</p>
            <div class="price">$25.00</div>
            <a href="#" class="btn">داواکردن / کڕین</a>
        </div>

        <div class="card">
            <h2>بەرهەمی دووەم</h2>
            <p>وەسفی بەرهەمی دووەم لێرە بنووسە. بەرزترین کوالیتی و باشترین نرخ.</p>
            <div class="price">$40.00</div>
            <a href="#" class="btn">داواکردن / کڕین</a>
        </div>
    </div>

    <footer>
        <p>© 2026 ADEL BRAND. هەموو مافەکانی پارێزراوە.</p>
    </footer>
</body>
</html>
