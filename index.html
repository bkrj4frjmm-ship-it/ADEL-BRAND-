<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADEL SEWING MACHINES</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background-color: #f5f5f7; color: #1d1d1f; padding-bottom: 40px; }
        
        /* Header Banner */
        .hero { position: relative; width: 100%; height: 220px; background: #000; overflow: hidden; display: flex; align-items: center; justify-content: center; }
        .logo-badge { position: absolute; top: 15px; right: 15px; background: #fff; width: 65px; height: 65px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 11px; text-align: center; color: #000; border: 2px solid #fff; z-index: 10; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        .welcome-text { position: absolute; bottom: 20px; right: 20px; color: #fff; font-size: 22px; font-weight: bold; text-shadow: 0 2px 4px rgba(0,0,0,0.5); z-index: 10; }
        
        /* Container */
        .container { padding: 20px; max-width: 800px; margin: 0 auto; }
        .section-title { font-size: 18px; font-weight: bold; margin-bottom: 15px; color: #1d1d1f; border-right: 4px solid #0071e3; padding-right: 10px; }
        
        /* Product & Video Box */
        .video-box { background: #fff; border-radius: 16px; padding: 16px; box-shadow: 0 4px 16px rgba(0,0,0,0.06); margin-bottom: 25px; }
        
        /* YouTube Embed Wrapper for Shorts */
        .video-container {
            position: relative;
            width: 100%;
            height: 480px;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 15px;
        }
        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
        
        /* Video Info */
        .video-info { margin-top: 10px; }
        .video-title { font-size: 18px; font-weight: bold; margin-bottom: 6px; color: #1d1d1f; }
        .video-desc { font-size: 14px; color: #6e6e73; margin-bottom: 12px; line-height: 1.6; }
        
        /* Price Tag */
        .price-row { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid #f0f0f2; padding-top: 12px; }
        .price { font-size: 19px; font-weight: bold; color: #0071e3; }
        .badge-new { background: #e8f2ff; color: #0071e3; font-size: 12px; font-weight: bold; padding: 4px 10px; border-radius: 20px; }
    </style>
</head>
<body>

    <!-- بەشی سەرەوەی وێبسایت -->
    <div class="hero">
        <div class="logo-badge">ADEL<br>SEWING</div>
        <div class="welcome-text">بەخێر هاتن بۆ پێشانگای عادل</div>
    </div>

    <!-- بەشی ناوەڕۆک و ڤیدیۆ -->
    <div class="container">
        <div class="section-title">ڤیدیۆی نمایشی مەکینەکان</div>
        
        <div class="video-box">
            <!-- ڤیدیۆی یوتیوب شۆرتس بە شێوەیەکی جێگیر -->
            <div class="video-container">
                <iframe src="https://www.youtube.com/embed/UksJtW_eVCw" title="YouTube video player" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
            </div>
            
            <div class="video-info">
                <div class="video-title">Brother Pacesetter Super Full Automatic</div>
                <div class="video-desc">مەکینەی دوورمانی ئەسڵی، فول ئۆتۆماتیک لەگەڵ چەندین شێوازی نەخش و دوورینی ناوازە بۆ کاری خیاطی.</div>
                
                <div class="price-row">
                    <div class="price">200 هەزار دینار</div>
                    <div class="badge-new">باشترین نرخ</div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
